[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:linevul]
directory=/app/linevul
command=python3 app.py
environment=PYTHONPATH="/app:/app/linevul",PORT="5000",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
directory=/app/backend
command=uvicorn app.main:app --host 0.0.0.0 --port 8001
environment=PYTHONPATH="/app:/app/backend",DATABASE_URL="postgresql://postgres:muneeb88@127.0.0.1:5432/vulnmark",LINEVUL_API_URL="http://127.0.0.1:5000",CVE_KB_PATH="/app/backend/app/cve_kb.json",CVE_INDEX_PATH="/app/cve_index.npy",CVE_METADATA_PATH="/app/cve_index_meta.json",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/app/frontend
command=npm start -- -H 0.0.0.0 -p 3000
environment=LOCAL_API_BASE_URL="http://127.0.0.1:8001",NEXT_PUBLIC_LOCAL_API_BASE_URL="http://localhost:8001",NEXT_PUBLIC_SITE_URL="http://localhost:3000",NEXT_PUBLIC_LINEVUL_API_URL="http://localhost:5000"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
