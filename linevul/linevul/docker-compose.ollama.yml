# Local Ollama for the LineVul 7B reranker.
# Usage: docker compose -f docker-compose.ollama.yml up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
